## Intro
As a big fan of music and data analytics I decided to tackle a personal project that combines the two. The popular streaming service Spotify provides users with a year-end analysis of that user’s personalized listening trends called Wrapped. It is a popular occurrence every December and as a fan of music and data analytics I eagerly await mine every year. However, upon finding out that you can request your past year of personal data from Spotify, including your listening history, I decided to try to replicate wrapped as best as I could with the data they provide. The data Spotify provides includes, for each listen, time of occurrence, artist name, track name and the duration of the listen in milliseconds. Noticeable missing pieces are genre and track length, which are not provided, so for now I will not recreate the genre analysis normally provided in Wrapped and instead look at other aspects. I have decided to look at my top artists and tracks by number of plays as well as by amount of time spent which Spotify does not include a comparison of in their Wrapped. Additionally, I will recreate a few easy to calculate stats such as number of unique artists and tracks listened to as well as a few new ones not included in Wrapped.

When I set out to start this project I had the following questions I wanted to answer:
1) How long do I spend listening to a song on average?
2) How many different artists did I listen to over the past year?
3) How many different tracks did I listen to over the past year?
4) What were my top 10 artists?
5) What were my top 10 tracks?
6) Does my top 10 change when counting total time spent listening vs number of plays?
7) How fierce was the competition among my top 10 over the course of the year?
---
## Acquiring Spotify Data
Next we have to load our data into a new SQL database and populate a new table with our data. Since the data is provided in JSON files we need to run the following code to load the JSON file contents into SQL and then break up the text into proper table format.
\`\`\`sql
Declare @JSON varchar(MAX)
Select @JSON=BulkColumn
From OPENROWSET (BULK 'FILE LOCATION', SINGLE_CLOB) import
Select * INTO ListeningHistory
From OPENJSON (@JSON)
With ([endTime] date,[artistName] nvarchar(MAX),[trackName] nvarchar(MAX),[msPlayed] int)
\`\`\`

The original project continues with data cleaning, SQL/R analysis, cumulative artist and track comparisons, findings, and future analysis directions.`;document.getElementById('project-content').innerHTML=marked.parse(markdown);</script><script src="../assets/js/jquery.min.js"></script><script src="../assets/js/jquery.poptrox.min.js"></script><script src="../assets/js/main.js"></script></body></html>
